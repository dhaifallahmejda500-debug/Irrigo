 <!DOCTYPE html>
<html>
<head>
<title>Irrigo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
font-family: Arial;
background: linear-gradient(135deg,#4facfe,#00f2fe);
color: white;
text-align: center;
}

.card {
background: white;
color: black;
margin: 20px;
padding: 20px;
border-radius: 20px;
}

button {
padding: 15px;
border: none;
border-radius: 10px;
background: #00c896;
color: white;
font-size: 16px;
}
</style>
</head>

<body>

<h2>RayTech Irrigation</h2>

<div class="card">
<h3>Temperature</h3>
<h1 id="temp">--</h1>
</div>

<div class="card">
<h3>Humidity</h3>
<h1 id="hum">--</h1>
</div>

<div class="card">
<h3>Soil</h3>
<h1 id="soil">--</h1>
</div>

<button onclick="toggleValve()">Toggle Valve</button>

<script src="/static/app.js"></script>

</body>
</html>
